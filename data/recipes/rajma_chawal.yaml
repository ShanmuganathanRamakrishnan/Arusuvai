# Rajma chawal — North Indian, and deliberately a *lunch* recipe rather than a
# dinner one: it is built on rice, and NORTH_DINNER has no rice slot. See the
# note on NORTH_LUNCH in core/foods/templates.py.
id: rajma_chawal
name: Rajma chawal
name_ta: ராஜ்மா சாதம்
name_hi: राजमा चावल

region: north_indian
# Not jain: onion and ginger-garlic are both classed root_vegetable (derived
# from ingredient classes; see data/recipes/schema.yaml).

category: combo_rice_legume
prep_minutes: 55
tags: [one_plate, lunch, high_protein]

serving_unit:
  measure: cup
  name: plate
  grams_per_unit: 350.0
  min_count: 1
  default_count: 1
  max_count: 2
  note: >-
    Overrides the generic cup weight: this unit is a composed plate of rajma
    over rice, not a cup of one thing. Two plates is the honest ceiling.

# Derived at load from the cooking-oil line: 8 g x 8.84 kcal/g x 0.10 band
# = 7.072 kcal on the plate's 471.74 kcal (garam_masala corrected 379->321
# kcal/100g 2026-07-24, see citations.py) = 0.0150.
#
# Rajma is soaked overnight and the soaking water discarded; mineral and
# folate losses through that step are real and unmeasured here.
process_uncertainty_unassessed: [iron_mg, calcium_mg, b12_ug]

ingredients:
  - id: rice_cooked
    quantity_g: 183.0
    state: cooked
    note: About 61 g raw milled rice, via yield.rice_milled_boiled.
  - id: rajma_cooked
    quantity_g: 110.0
    state: cooked
    note: About 46 g dry rajma, soaked overnight, via yield.rajma_soaked_boiled.
  - id: onion_raw
    quantity_g: 20.0
    state: raw
  - id: tomato_raw
    quantity_g: 20.0
    state: raw
  - id: sunflower_oil
    quantity_g: 8.0
    state: as_used
    process: oil_uptake.vegetable_tempering
    note: >-
      Retained oil. About 8.4 g into the pan; the masala is served whole, so
      almost none is left behind (oil_uptake.vegetable_tempering = 0.95).
  - id: ginger_garlic_paste
    quantity_g: 5.0
    state: as_used
  - id: garam_masala
    quantity_g: 2.0
    state: as_used
  - id: salt_iodised
    quantity_g: 2.0
    state: as_used
