# Recipe file format
#
# One recipe per file. This document is the specification; the three files
# beside it are worked examples. `core/foods/recipe_loader.py` enforces
# everything stated here — where this document and the loader disagree, the
# loader is the defect.
#
# ---------------------------------------------------------------------------
# The two rules that are easy to get wrong
# ---------------------------------------------------------------------------
#
# 1. QUANTITIES ARE FINISHED WEIGHTS, AND THEY SUM TO ONE SERVING UNIT.
#
#    `ingredients[].quantity_g` is the mass of that constituent in the plated
#    dish, and the ingredient list sums to `serving_unit.grams_per_unit`
#    (within 2%). The loader rejects a recipe where it does not.
#
#    Each line also carries `state`, naming the composition basis to look the
#    ingredient up on. Rice roughly triples on cooking, so a raw value read
#    against a cooked quantity is a 3x error, not a tolerance-band problem —
#    which is why the basis is stated per line rather than assumed per file.
#
#    Where a dish is made from a raw constituent that absorbs water (a dosa
#    from rice-and-urad batter), record the raw constituents on a `raw` basis
#    and list the absorbed `water` explicitly, so the masses still sum to the
#    finished weight. Do not multiply by a yield factor inline: go through
#    `core/foods/retention.py`, which reads the factor from `citations.py`.
#
#    Oil lines record the oil RETAINED in the finished dish, not the oil put
#    in the pan. Note the applied amount in `note` for the cook's benefit; the
#    retained figure comes from a registered oil-uptake constant.
#
# 2. NO NUTRITIONAL CONSTANT MAY BE INVENTED IN THIS FILE.
#
#    `process_uncertainty` is NOT a field in this file. The loader derives it,
#    per macro, from the process constants attached to the ingredient lines and
#    each line's actual macro contribution. A file that declares it is rejected:
#    a figure hand-computed once and pasted here goes stale the moment the
#    constant in citations.py changes, with the suite still green. The rule
#    against magic numbers does not stop at the boundary of a data file.
#
#    Every macro gets a value — there is no default-zero. A macro that nothing
#    process-sensitive touches derives to a *computed* 0.0, which an author
#    cannot obtain by leaving the work undone. A macro you believe is
#    process-sensitive but cannot quantify goes in
#    `process_uncertainty_unassessed`, which takes the registered
#    `process.unassessed_uncertainty` band — deliberately wider than any
#    measured constant in the registry, so declaring something unassessed is
#    never the cheap route to a tidy number.
#
#    A dish with NO `process:` line anywhere must say which case it is in, or
#    the loader rejects it (D10, 2026-08-09; `docs/audit_log.md` finding 2).
#    Curd raita and a griddled phulka produced byte-identical zeros from
#    byte-identical silence, and the loader could not tell "raw, so genuinely
#    zero" from "cooked, but nobody did the work." So: either declare
#    `preparation: uncooked`, or list the macros in
#    `process_uncertainty_unassessed`. `preparation` defaults to `cooked`
#    precisely because omission is the cheapest authoring path and must lead to
#    the demanding treatment, never the confident one.
#
# 3. PROCESS ATTRIBUTION GOES ON THE LINE, NOT THE RECIPE.
#
#    A line whose quantity was determined by a registered constant names it in
#    `process`. A masala dosa has two `gingelly_oil` lines — griddle and
#    tempering — that differ only by which process they belong to, which a
#    recipe-level list cannot express.
#
#    There is no recipe-level `process_constants` key. It is derived from the
#    lines, and the loader rejects a file that still declares one: a
#    hand-maintained list can silently disagree with the ingredients it claims
#    to describe. Exposure (how many grams a constant governs) is likewise
#    computed, never written down.
#
# ---------------------------------------------------------------------------
# Fields
# ---------------------------------------------------------------------------

id: string # stable, snake_case, unique across the library
name: string # display name, English
name_ta: string # optional, Tamil
name_hi: string # optional, Hindi

region: south_indian | north_indian | pan_indian

# Which diet patterns this dish satisfies. Stated explicitly, never inferred:
# jain excludes onion, garlic and root vegetables, and that is not derivable
# from "vegetarian".
diet_patterns: [vegetarian, vegan, jain, eggetarian, non_vegetarian]

# The role this dish plays inside a MealTemplate slot (see core/foods/templates.py).
# Must be a category some template accepts, or the recipe can never be planned.
category: string # e.g. tiffin, sambar, chutney, rice, mixed_rice, poriyal, dal, sabzi, roti

prep_minutes: int
tags: [string] # free-form: one_pot, high_protein, festive, ...

# The discrete thing the eater is handed. The solver searches integer counts in
# [min_count, max_count]. There is no continuous multiplier and no five-point
# multiplier scale anywhere in this system: 1.25 idlis is 3.75 idlis at three
# units, which nobody can serve.
serving_unit:
  measure: string # a key from core/foods/portions.py MEASURES
  name: string # optional display override, defaults to the measure name
  grams_per_unit: float # may differ from the generic measure weight; if so, say why in note
  min_count: int # >= 1
  default_count: int # min <= default <= max
  max_count: int
  note: string # optional; required in spirit if grams_per_unit overrides the measure

# Whether the dish involves a cooking step at all. Optional; defaults to
# `cooked`, which is the demanding case — see rule 2 above. `uncooked` is a
# claim about the food, checked against the lines: a recipe declaring it may not
# also carry a `process:` key, since a dish that is not cooked has no cooking
# process to attribute uncertainty to.
preparation: cooked | uncooked

# Macros you believe cooking affects but for which no constant is registered.
# These take the wide registered `process.unassessed_uncertainty` band instead
# of deriving to zero. There is NO `process_uncertainty` key — it is derived.
process_uncertainty_unassessed: [fibre_g, iron_mg, calcium_mg, b12_ug]

ingredients:
  - id: string # must exist in the loaded ingredient set
    quantity_g: float # finished weight, > 0
    state: raw | cooked | as_used # composition basis to look up
    process: string # optional; the citations.py constant that set this quantity
    note: string # optional
