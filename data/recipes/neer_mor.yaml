# Neer mor — thin spiced buttermilk: curd whisked with a lot of water, salt,
# green chilli and curry leaves.
#
# TASKS_3.md R4d (South Indian snack). The ordinary Tamil drink beside an
# evening snack or after a meal, and the library's first recipe in
# `category: buttermilk` — a category SOUTH_BREAKFAST.curd_course and
# SOUTH_LUNCH.curd_course already accept, so this dish can also be selected
# there. That is an expected side effect, not a hidden one; its effect on
# those templates is measured in the same commit.
#
# Added, with the owner's approval, as a small optional extra for the snack
# plate: the templates module's own header gives the reason such slots exist
# ("an optional slot that contributes ~30 kcal is exactly the sort of thing the
# solver can use to close a small energy gap"). Stated plainly: it was chosen
# knowing it would help snacks plan. The dish and its proportions are the
# ordinary ones — roughly one part curd to three parts water — not tuned.
id: neer_mor
preparation: uncooked
name: Neer mor
name_ta: நீர் மோர்
name_hi: छाछ

region: south_indian
# Dairy via curd_dahi's class, so not vegan (derived from ingredient classes;
# see data/recipes/schema.yaml).

category: buttermilk
prep_minutes: 3
tags: [snack, beverage, cooling, quick]

serving_unit:
  measure: cup
  name: glass
  grams_per_unit: 200.0
  min_count: 1
  default_count: 1
  max_count: 1
  note: >-
    One glass, shown as "glass" on the generic cup measure and overriding its
    weight to the summed mass below, because a tumbler of neer mor is poured
    fuller than a measuring cup. The ceiling is one because this is a thin drink beside a
    snack, not a course: it carries little of anything, and letting the
    solver pour a second glass would be using water-diluted curd to nudge
    calcium and sodium rather than serving a plate anyone drinks.

# Nothing is cooked (whisked curd and water), same as thayir_plain and
# soya_curd -- see that recipe's header and docs/audit_log.md finding 2.
process_uncertainty_unassessed: [iron_mg, calcium_mg, b12_ug]

ingredients:
  - id: curd_dahi
    quantity_g: 50.0
    state: as_used
    note: About a quarter of the glass -- the ordinary thin-buttermilk proportion.
  - id: water
    quantity_g: 148.0
    state: as_used
  - id: salt_iodised
    quantity_g: 0.8
    state: as_used
    note: >-
      0.40% of the finished weight -- neer mor is salted to taste, lightly.
      An authored quantity, not a measurement.
  - id: green_chilli
    quantity_g: 0.6
    state: raw
    note: Crushed into the drink.
  - id: curry_leaves
    quantity_g: 0.6
    state: raw
    note: Torn or crushed into the drink.
