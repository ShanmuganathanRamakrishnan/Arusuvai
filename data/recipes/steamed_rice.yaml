# Steamed rice — sadam. Plain boiled rice, the thing a South Indian lunch is
# built on, and the most conspicuous absence in the library until now:
# SOUTH_LUNCH.rice_base accepts {rice, mixed_rice} and the `rice` category was
# EMPTY. Every south_lunch plate the enumerator could build was therefore
# sambar sadam, a one-pot mixed rice, standing in for a course it is not.
#
# WHY IT IS PART OF D3, and again it is not about protein — this dish carries
# no high-quality protein either. It is the only energy in the library that
# costs no sodium:
#
#   sambar_sadam   265.0 kcal   408.6 mg Na  = 1.54 mg Na/kcal
#   steamed_rice   260.0 kcal     2.0 mg Na  = 0.008 mg Na/kcal
#
# South lunch's target is 854.9-944.9 kcal against a HARD 1400 mg sodium
# ceiling (day_budget.absurdity_fraction; no relaxation rung widens past it).
# A plate that clears the 39.2 g protein floor must spend ~647 mg on two
# katoris of a protein-dense gravy, ~262 mg on the required curd course and
# 240-395 mg on the required vegetable. That leaves on the order of 100-250 mg
# for the base. Only unsalted rice fits inside it.
#
# Plain rice takes NO salt. That is not a health choice made here, it is how
# the dish is cooked — the salt on a South Indian plate is in the sambar, the
# poriyal and the pickle, and rice is the neutral thing they are eaten with.
# The 2 mg below is the rice's own sodium, not a seasoning.
id: steamed_rice
name: Steamed rice
name_ta: சாதம்
name_hi: चावल

region: south_indian

category: rice
main_ingredients: [rice]
prep_minutes: 20
tags: [lunch, base, plain, low_sodium]

serving_unit:
  measure: cup
  name: small katori
  grams_per_unit: 120.0
  min_count: 1
  default_count: 2
  max_count: 5
  note: >-
    120 g of cooked rice, overriding the generic 200 g cup (TASKS_3.md N32a,
    docs/audit_log.md 2026-10-17). The smallest cereal portion in the adult
    sample diets of ICMR-NIN, Dietary Guidelines for Indians (2024), Annexure V,
    p. 121: dinner, 40 g raw, "1/4 of a medium (200ml) katori", for elderly
    adults. At the project's unverified 3.0 boiling yield
    (yield.rice_milled_boiled) that is 120 g cooked. The same annexure's other
    adult meals run 60-100 g raw (180-300 g cooked), which 2, 3 and 4 of these
    reach; with one 200 g step the smallest plate was already above what a
    smaller or fat-losing adult's meal can hold: 24 of N31's 46 known gaps
    were South lunches and dinners that this step closes. Five units is
    600 g, the same ceiling three 200 g cups gave. sambar_sadam keeps the 200 g cup: it is a one-pot dish served
    by the cup, not rice served beside a gravy.

# One ingredient, on a cooked basis, against a fixed 200 g portion — so cooking
# yield does not enter this file at all.
#
# SUPERSEDED (D10, 2026-08-09): D10 rejected that argument and extended the
# unassessed list below from the three micronutrients to all nine macros,
# reasoning that "boiling is still a cooking step whatever the basis the
# composition row is stated on."
#
# SUPERSEDED IN TURN (D12, 2026-08-09, docs/audit_log.md finding 44). D10's
# sentence is true about rice and false about this file. `rice_cooked` is a
# cooked-basis composition record: the boiling happened before the record was
# made, and this recipe applies no transformation to it — it names a 200 g
# portion of an already-boiled food. There is no process step here whose
# uncertainty went unmeasured, so charging 0.20 on every macro charged the dish
# for work it does not do. The doubt that remains is doubt about whether the
# row itself is right, and that is composition uncertainty, already charged at
# 0.25. D10 double-counted it. The loader now earns these zeros structurally:
# no raw-basis line feeds any macro here, so none needs justifying.
#
# The three micronutrients stay, at the original author's judgment and not the
# loader's requirement: boiling rice in excess water and draining it (the
# ordinary South Indian method, as against the absorption method) leaches
# minerals into water that is thrown away, and whether a hand-entered cooked
# row accounts for that is genuinely unknown. Conservative, and free — none of
# the three has a target anywhere in the system.
process_uncertainty_unassessed: [iron_mg, calcium_mg, b12_ug]

ingredients:
  - id: rice_cooked
    quantity_g: 120.0
    state: cooked
    note: >-
      The whole portion. rice_cooked is a cooked-basis composition row, so the
      roughly-3x boiling yield is already inside it rather than applied here —
      see yield.rice_milled_boiled in citations.py for the factor connecting
      this row to rice_milled_raw.
