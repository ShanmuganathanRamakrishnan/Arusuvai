[project]
name = "foodai"
version = "0.1.0"
description = "AI meal planner for South and North Indian diets — portfolio project."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    # Accounts + profile persistence (Tier B auth): a User/Profile table via
    # SQLAlchemy, real bcrypt password hashing (not a homemade scheme), and a
    # signed session cookie (starlette.middleware.sessions.SessionMiddleware,
    # which itsdangerous backs) rather than a heavier auth framework.
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
# httpx backs fastapi.testclient.TestClient; uvicorn runs the app locally.
dev = ["pytest>=8.0", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Browser-backed layout checks for web/. Dev-only (playwright + a static
# server); they skip themselves when either is absent, so a bare checkout
# still runs `python -m pytest tests/ -q` clean. Run just those with
# `-m web`, or exclude them with `-m "not web"`.
#
# That clean run is the point and also the hazard: it is how a frontend test
# surface reports green without having looked at anything. Since D8 the skips
# are announced in a block at the end of the run, and `FOODAI_WEB_TESTS=required`
# turns each one into a failure -- see `tests/conftest.py`.
markers = ["web: browser-backed layout checks (needs playwright + a static server)"]
